<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>🎸 Случайная песня</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
  --bg:#0e0f12;
  --card:#17191e;
  --card2:#1e2128;
  --text:#f3f3f3;
  --muted:#9297a3;
  --accent:#ffb52e;
  --green:#5dd39e;
  --red:#ff6464;
  --border:#292d35;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,
input,
select{
  font:inherit;
}

.app{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:14px 14px 40px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.subtitle{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.iconBtn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:var(--card);
  color:white;
  border-radius:14px;
  font-size:20px;
}

.search{
  width:100%;
  padding:13px 15px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  color:white;
  outline:none;
  margin-bottom:10px;
}

.search::placeholder{
  color:#737985;
}

.filters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}

select{
  width:100%;
  padding:11px 12px;
  background:var(--card);
  color:white;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}

.btn{
  border:0;
  border-radius:14px;
  padding:13px 10px;
  font-weight:700;
  color:#111;
  background:var(--accent);
}

.btn.secondary{
  background:var(--card2);
  color:white;
  border:1px solid var(--border);
}

.btn:active,
.iconBtn:active{
  transform:scale(.98);
}

.song{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
}

.songTop{
  padding:17px 17px 13px;
  border-bottom:1px solid var(--border);
}

.artist{
  color:var(--accent);
  font-size:14px;
  font-weight:700;
  margin-bottom:3px;
}

.title{
  font-size:25px;
  line-height:1.15;
  font-weight:800;
  padding-right:42px;
}

.songMeta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}

.badge{
  background:var(--card2);
  border:1px solid var(--border);
  color:#d9dce2;
  border-radius:9px;
  padding:5px 8px;
  font-size:11px;
}

.badge.good{
  color:var(--green);
}

.badge.warn{
  color:#ffc75b;
}

.favorite{
  position:absolute;
  right:16px;
  top:16px;
  width:40px;
  height:40px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card2);
  color:white;
  font-size:21px;
}

.songTop{
  position:relative;
}

.chordBlock{
  padding:15px 17px;
  background:#121419;
}

.mainLabel{
  color:var(--muted);
  text-transform:uppercase;
  font-size:10px;
  letter-spacing:.08em;
  margin-bottom:7px;
}

.mainChords{
  font-size:21px;
  font-weight:800;
  letter-spacing:.03em;
  color:#fff;
  line-height:1.5;
}

.section{
  padding:16px 17px;
  border-top:1px solid var(--border);
}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  font-weight:800;
  font-size:15px;
}

.line{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  padding:9px 0;
  border-bottom:1px solid #22252c;
}

.line:last-child{
  border-bottom:0;
}

.cue{
  color:#d7d9de;
  font-size:13px;
  line-height:1.35;
}

.chords{
  color:var(--accent);
  font-weight:800;
  font-size:15px;
  white-space:nowrap;
}

.note{
  margin:14px 17px;
  padding:12px;
  background:#211e17;
  border:1px solid #453a23;
  border-radius:12px;
  color:#d8c69c;
  font-size:12px;
  line-height:1.45;
}

.note.good{
  background:#16231e;
  border-color:#284f40;
  color:#9be0bf;
}

.unverified{
  margin:15px 17px;
  padding:13px;
  border-radius:13px;
  background:#241b18;
  border:1px solid #49302a;
  color:#d8aaa0;
  font-size:12px;
  line-height:1.45;
}

.empty{
  padding:35px 15px;
  text-align:center;
  color:var(--muted);
}

.bottom{
  margin-top:13px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.toggle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:13px;
  color:#ddd;
  font-size:12px;
}

.toggle input{
  width:18px;
  height:18px;
}

.set{
  margin-top:12px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
}

.set h3{
  margin:0 0 10px;
}

.setItem{
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

.setItem:last-child{
  border-bottom:0;
}

.footer{
  text-align:center;
  color:#5f646f;
  font-size:10px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>
      <div class="logo">🎸 Случайная песня</div>
      <div class="subtitle">Русский рок для гитары</div>
    </div>

    <button class="iconBtn" onclick="showFavorites()">♥</button>
  </div>

  <input
    id="search"
    class="search"
    placeholder="🔎 Найти песню или исполнителя..."
    oninput="renderList()"
  >

  <div class="filters">
    <select id="artistFilter" onchange="renderList()">
      <option value="">Все исполнители</option>
    </select>

    <select id="difficultyFilter" onchange="renderList()">
      <option value="">Любая сложность</option>
      <option value="1">⭐ Легко</option>
      <option value="2">⭐⭐ Средне</option>
      <option value="3">⭐⭐⭐ Сложно</option>
    </select>
  </div>

  <div class="actions">
    <button class="btn" onclick="randomSong()">
      🎲 Случайная
    </button>

    <button class="btn secondary" onclick="makeSet()">
      🎤 Сет 30 минут
    </button>
  </div>

  <div class="bottom">
    <label class="toggle">
      <span>✓ Только проверенные</span>
      <input id="verifiedOnly" type="checkbox" checked onchange="renderList()">
    </label>

    <label class="toggle">
      <span>🎵 Только аккорды</span>
      <input id="chordsOnly" type="checkbox" onchange="renderCurrent()">
    </label>
  </div>

  <div id="content"></div>

  <div class="footer">
    🎸 120 песен · версия 1.0
  </div>

</div>

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */

let currentSong = null;
let favorites = JSON.parse(localStorage.getItem("guitarFavorites") || "[]");
let showFav = false;


/* =========================================================
   ИНИЦИАЛИЗАЦИЯ
   ========================================================= */

const tg = window.Telegram && window.Telegram.WebApp
  ? window.Telegram.WebApp
  : null;

if(tg){
  tg.ready();
  tg.expand();

  try{
    tg.setHeaderColor("#0e0f12");
    tg.setBackgroundColor("#0e0f12");
  }catch(e){}
}

const artistFilter = document.getElementById("artistFilter");

[...new Set(songs.map(s => s.a))]
  .sort((a,b)=>a.localeCompare(b,"ru"))
  .forEach(artist=>{
    const option=document.createElement("option");
    option.value=artist;
    option.textContent=artist;
    artistFilter.appendChild(option);
  });


/* =========================================================
   УТИЛИТЫ
   ========================================================= */

function stars(d){
  return "⭐".repeat(d);
}

function isFavorite(song){
  return favorites.includes(song.a + "|" + song.t);
}

function toggleFavorite(){
  if(!currentSong) return;

  const key=currentSong.a+"|"+currentSong.t;

  if(favorites.includes(key)){
    favorites=favorites.filter(x=>x!==key);
  }else{
    favorites.push(key);
  }

  localStorage.setItem("guitarFavorites",JSON.stringify(favorites));
  renderCurrent();
}

function escapeHtml(str){
  if(!str) return "";
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}


/* =========================================================
   ФИЛЬТРАЦИЯ
   ========================================================= */

function getFilteredSongs(){

  const search=
    document.getElementById("search").value
      .trim()
      .toLowerCase();

  const artist=
    document.getElementById("artistFilter").value;

  const diff=
    document.getElementById("difficultyFilter").value;

  const verifiedOnly=
    document.getElementById("verifiedOnly").checked;

  return songs.filter(song=>{

    if(verifiedOnly && !song.verified) return false;

    if(artist && song.a!==artist) return false;

    if(diff && String(song.d)!==diff) return false;

    if(search){

      const hay=(song.a+" "+song.t).toLowerCase();

      if(!hay.includes(search)) return false;
    }

    return true;
  });
}


/* =========================================================
   РЕНДЕР СЛУЧАЙНОЙ ПЕСНИ
   ========================================================= */

function randomSong(){

  const list=getFilteredSongs();

  if(!list.length){

    currentSong=null;

    document.getElementById("content").innerHTML=`
      <div class="empty">
        Ничего не найдено.<br>
        Попробуй изменить фильтры.
      </div>
    `;

    return;
  }

  currentSong=list[Math.floor(Math.random()*list.length)];

  renderCurrent();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================================================
   КАРТОЧКА ПЕСНИ
   ========================================================= */

function renderCurrent(){

  const content=document.getElementById("content");

  if(!currentSong){
    randomSong();
    return;
  }

  const s=currentSong;
  const chordsOnly=document.getElementById("chordsOnly").checked;

  let html=`
    <div class="song">

      <div class="songTop">

        <button
          class="favorite"
          onclick="toggleFavorite()"
          title="Избранное"
        >
          ${isFavorite(s) ? "♥" : "♡"}
        </button>

        <div class="artist">
          ${escapeHtml(s.a)}
        </div>

        <div class="title">
          ${escapeHtml(s.t)}
        </div>

        <div class="songMeta">

          <span class="badge">
            ${stars(s.d)}
          </span>

          ${
            s.bpm
            ? `<span class="badge">♩ ${s.bpm} BPM</span>`
            : ""
          }

          ${
            s.beat
            ? `<span class="badge">🥁 ${escapeHtml(s.beat)}</span>`
            : ""
          }

          ${
            s.verified
            ? `<span class="badge good">✓ аккорды проверены</span>`
            : `<span class="badge warn">⚠ требует проверки</span>`
          }

        </div>

      </div>
  `;


  /* НЕПРОВЕРЕННАЯ ПЕСНЯ */

  if(!s.verified){

    html+=`
      <div class="unverified">
        <b>⚠ Аккорды пока не добавлены.</b><br><br>
        Эта песня есть в каталоге, но я специально не
        подставляю сюда предполагаемые аккорды.
        Лучше ничего, чем неправильная схема.
      </div>
    `;

    html+=`</div>`;

    content.innerHTML=html;

    return;
  }


  /* ТОЛЬКО АККОРДЫ */

  if(chordsOnly){

    html+=`
      <div class="chordBlock">

        <div class="mainLabel">
          Основная схема
        </div>

        <div class="mainChords">
          ${escapeHtml(s.chords)}
        </div>

      </div>
    `;

    html+=`</div>`;

    content.innerHTML=html;

    return;
  }


  /* ПОЛНАЯ КАРТОЧКА */

  html+=`

    <div class="chordBlock">

      <div class="mainLabel">
        Основные аккорды
      </div>

      <div class="mainChords">
        ${escapeHtml(s.chords)}
      </div>

    </div>
  `;


  if(s.intro){

    html+=section(
      "🎸 Вступление",
      s.intro
    );
  }

  if(s.verse){

    html+=section(
      "🎤 Куплет",
      s.verse
    );
  }

  if(s.chorus){

    html+=section(
      "🔥 Припев",
      s.chorus
    );
  }

  if(s.bridge){

    html+=section(
      "🎵 Проигрыш / переход",
      s.bridge
    );
  }


  html+=`
    <div class="note good">
      <b>Как пользоваться:</b><br>
      Это короткая гитарная шпаргалка.
      Полный текст песни здесь намеренно не хранится.
      Используй ориентиры разделов вместе с текстом,
      который у тебя уже есть.
    </div>
  `;

  html+=`</div>`;

  content.innerHTML=html;
}


function section(title,text){

  return `
    <div class="section">

      <div class="sectionTitle">
        ${title}
      </div>

      <div class="line">

        <div class="cue">
          ${escapeHtml(text)}
        </div>

      </div>

    </div>
  `;
}


/* =========================================================
   СПИСОК / ПОИСК
   ========================================================= */

function renderList(){

  const list=getFilteredSongs();

  if(!list.length){

    document.getElementById("content").innerHTML=`
      <div class="empty">
        Ничего не найдено.
      </div>
    `;

    return;
  }

  if(!currentSong || !list.includes(currentSong)){
    currentSong=list[0];
  }

  renderCurrent();
}


/* =========================================================
   ИЗБРАННОЕ
   ========================================================= */

function showFavorites(){

  showFav=!showFav;

  if(!showFav){

    renderList();

    return;
  }

  const html=favSongs.map(s=>`

    <div

      style="
        background:var(--card);
        border:1px solid var(--border);
        border-radius:14px;
        padding:13px;
        margin-bottom:8px;
        cursor:pointer;
      "
    >

      <div style="
        color:var(--accent);
        font-size:12px;
        font-weight:700;
      ">
        ${escapeHtml(s.a)}
      </div>

      <div style="
        font-size:16px;
        font-weight:800;
        margin-top:2px;
      ">
        ${escapeHtml(s.t)}
      </div>

    </div>

  `).join("");

  document.getElementById("content").innerHTML=`

    <div style="
      color:var(--muted);
      font-size:12px;
      margin:8px 2px;
    ">
      ❤️ Избранное · ${favSongs.length}
    </div>

    ${html}

  `;
}


function openSong(artist,title){

  showFav=false;

  currentSong=songs.find(
    s=>s.a===artist && s.t===title
  );

  renderCurrent();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================================================
   СЕТ НА 30 МИНУТ
   ========================================================= */

function makeSet(){

  const pool=songs.filter(s=>s.verified);

  const shuffled=[...pool]
    .sort(()=>Math.random()-.5);

  const selected=shuffled.slice(0,7);

  let total=0;

  const items=selected.map((s,i)=>{

    const minutes=4 + Math.floor(Math.random()*2);

    total+=minutes;

    return `
      <div class="setItem">
        <b>${i+1}. ${escapeHtml(s.a)}</b>
        — ${escapeHtml(s.t)}
        <span style="color:var(--muted)">
          · ~${minutes} мин
        </span>
      </div>
    `;
  }).join("");

  document.getElementById("content").innerHTML=`

    <div class="set">

      <h3>🎤 Сет на ~30 минут</h3>

      ${items}

      <div style="
        color:var(--muted);
        font-size:11px;
        margin-top:12px;
      ">
        ${selected.length} песен · ориентировочно ${total} минут
      </div>

      <button
        class="btn"
        style="width:100%;margin-top:12px"
        onclick="randomSong()"
      >
        🎸 Играть
      </button>

    </div>
  `;
}


/* =========================================================
   СТАРТ
   ========================================================= */

randomSong();

</script>
