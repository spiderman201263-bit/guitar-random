* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #101010;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 16px;
}

h1 {
    font-size: 28px;
    margin: 5px 0 4px;
}

.subtitle {
    color: #999;
    font-size: 14px;
    margin-bottom: 18px;
}

.card {
    background: #1b1b1b;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 14px;
    border: 1px solid #292929;
}

.artist {
    color: #ffb300;
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 5px;
}

.song-title {
    font-size: 25px;
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 12px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 15px;
}

.tag {
    background: #292929;
    color: #ccc;
    padding: 6px 9px;
    border-radius: 9px;
    font-size: 12px;
}

.tag.easy {
    color: #7cff9b;
}

.tag.medium {
    color: #ffd166;
}

.tag.hard {
    color: #ff7777;
}

.section-title {
    color: #aaa;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .7px;
    margin: 15px 0 7px;
}

.chords {
    font-size: 21px;
    font-weight: 700;
    line-height: 1.5;
    color: #fff;
    word-break: break-word;
}

.extra {
    color: #aaa;
    font-size: 14px;
    line-height: 1.45;
}

button {
    border: 0;
    border-radius: 15px;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.main-button {
    width: 100%;
    background: #ffb300;
    color: #111;
    font-size: 18px;
    margin-bottom: 10px;
}

.secondary {
    background: #292929;
    color: #fff;
}

.button-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

select {
    width: 100%;
    background: #202020;
    color: #fff;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
}

.moods {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding-bottom: 3px;
}

.mood {
    flex: 0 0 auto;
    padding: 9px 12px;
    border-radius: 12px;
    background: #252525;
    color: #ccc;
    font-size: 13px;
}

.mood.active {
    background: #ffb300;
    color: #111;
}

.favorite {
    font-size: 25px;
    float: right;
    cursor: pointer;
}

.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
}

.info {
    background: #222;
    border-radius: 12px;
    padding: 11px;
}

.info-label {
    color: #888;
    font-size: 11px;
    margin-bottom: 3px;
}

.info-value {
    font-size: 14px;
    font-weight: 700;
}

.notice {
    padding: 11px;
    background: #302916;
    color: #ffd166;
    border-radius: 11px;
    font-size: 13px;
    line-height: 1.4;
}

.verified {
    padding: 10px;
    background: #18271d;
    color: #8dffab;
    border-radius: 11px;
    font-size: 13px;
}

.set-list {
    margin-top: 10px;
}

.set-item {
    padding: 10px 0;
    border-bottom: 1px solid #292929;
}

.set-item:last-child {
    border-bottom: 0;
}

.small {
    color: #777;
    font-size: 12px;
}

.footer {
    text-align: center;
    color: #666;
    font-size: 12px;
    padding: 12px 0 25px;

<div class="container">

    <h1>🎸 Случайная песня</h1>
    <div class="subtitle">
        Русский рок для гитары · 120 песен
    </div>

    <div class="card" id="songCard">
        <div class="artist" id="artist"></div>

        <span class="favorite" id="favorite" onclick="toggleFavorite()">♡</span>

        <div class="song-title" id="title"></div>

        <div class="tags">
            <span class="tag" id="difficulty"></span>
            <span class="tag" id="moodTag"></span>
            <span class="tag" id="verifiedTag"></span>
        </div>

        <div class="section-title">Основные аккорды</div>
        <div class="chords" id="chords"></div>

        <div id="verification"></div>

        <div class="section-title">Как играть</div>
        <div class="info-grid">

            <div class="info">
                <div class="info-label">БОЙ</div>
                <div class="info-value" id="beat"></div>
            </div>

            <div class="info">
                <div class="info-label">ТЕМП</div>
                <div class="info-value" id="bpm"></div>
            </div>

            <div class="info">
                <div class="info-label">КАПО</div>
                <div class="info-value" id="capo"></div>
            </div>

            <div class="info">
                <div class="info-label">НАСТРОЕНИЕ</div>
                <div class="info-value" id="mood"></div>
            </div>

        </div>

        <div class="section-title">Примечание</div>
        <div class="extra" id="note"></div>
    </div>

    <button class="main-button" onclick="randomSong()">
        🎲 Случайная песня
    </button>

    <div class="button-row">
        <button class="secondary" onclick="makeSet()">
            🎤 Сет на 30 минут
        </button>

        <button class="secondary" onclick="showFavorites()">
            ⭐ Избранное
        </button>
    </div>

    <div class="card">

        <div class="section-title">Сложность</div>

        <div class="filters">
            <select id="difficultyFilter" onchange="applyFilters()">
                <option value="all">Любая</option>
                <option value="1">⭐ Очень легко</option>
                <option value="2">⭐⭐ Легко</option>
                <option value="3">⭐⭐⭐ Средне</option>
                <option value="4">⭐⭐⭐⭐ Сложно</option>
                <option value="5">⭐⭐⭐⭐⭐ Очень сложно</option>
            </select>

            <select id="artistFilter" onchange="applyFilters()">
                <option value="all">Все исполнители</option>
            </select>
        </div>

        <div class="section-title">Настроение</div>

        <div class="moods">
            <div class="mood active" data-mood="all" onclick="setMood('all', this)">
                Все
            </div>
            <div class="mood" data-mood="романтика" onclick="setMood('романтика', this)">
                ❤️ Романтика
            </div>
            <div class="mood" data-mood="грусть" onclick="setMood('грусть', this)">
                🌧 Грусть
            </div>
            <div class="mood" data-mood="драйв" onclick="setMood('драйв', this)">
                🔥 Драйв
            </div>
            <div class="mood" data-mood="ностальгия" onclick="setMood('ностальгия', this)">
                🕰 Ностальгия
            </div>
            <div class="mood" data-mood="душевное" onclick="setMood('душевное', this)">
                🍺 Душевное
            </div>
        </div>

    </div>

    <div id="setCard"></div>

    <div class="footer">
        🎸 Внутри лампового комбика
    </div>

</div>

/* =========================================================
   ЛОГИКА
========================================================= */

let currentSong = null;
let currentMood = "all";
let filteredSongs = [...songs];

const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();

    if (tg.setHeaderColor) {
        tg.setHeaderColor("#101010");
    }

    if (tg.setBackgroundColor) {
        tg.setBackgroundColor("#101010");
    }
}


/* ================= ИЗБРАННОЕ ================= */

function getFavorites() {
    try {
        return JSON.parse(localStorage.getItem("guitarFavorites") || "[]");
    } catch {
        return [];
    }
}

function saveFavorites(arr) {
    localStorage.setItem("guitarFavorites", JSON.stringify(arr));
}

function songKey(song) {
    return song.artist + "||" + song.title;
}

function isFavorite(song) {
    return getFavorites().includes(songKey(song));
}

function toggleFavorite() {

    if (!currentSong) return;

    let fav = getFavorites();
    const key = songKey(currentSong);

    if (fav.includes(key)) {
        fav = fav.filter(x => x !== key);
    } else {
        fav.push(key);
    }

    saveFavorites(fav);
    updateFavoriteIcon();
}

function updateFavoriteIcon() {
    document.getElementById("favorite").textContent =
        isFavorite(currentSong) ? "♥" : "♡";
}


/* ================= ФИЛЬТРЫ ================= */

function initArtists() {

    const select = document.getElementById("artistFilter");

    const artists = [...new Set(songs.map(s => s.artist))]
        .sort((a,b) => a.localeCompare(b, "ru"));

    artists.forEach(artist => {

        const option = document.createElement("option");

        option.value = artist;
        option.textContent = artist;

        select.appendChild(option);
    });
}

function applyFilters() {

    const difficulty =
        document.getElementById("difficultyFilter").value;

    const artist =
        document.getElementById("artistFilter").value;

    filteredSongs = songs.filter(song => {

        const diffOk =
            difficulty === "all" ||
            String(song.difficulty) === difficulty;

        const artistOk =
            artist === "all" ||
            song.artist === artist;

        const moodOk =
            currentMood === "all" ||
            song.mood === currentMood;

        return diffOk && artistOk && moodOk;
    });

    if (!filteredSongs.length) {
        alert("По этим фильтрам песен не найдено.");
        return;
    }

    randomSong();
}


/* ================= НАСТРОЕНИЯ ================= */

function setMood(mood, element) {

    currentMood = mood;

    document.querySelectorAll(".mood")
        .forEach(x => x.classList.remove("active"));

    element.classList.add("active");

    applyFilters();
}


/* ================= СЛУЧАЙНАЯ ПЕСНЯ ================= */

function randomSong() {

    if (!filteredSongs.length) {
        filteredSongs = [...songs];
    }

    const index =
        Math.floor(Math.random() * filteredSongs.length);

    currentSong = filteredSongs[index];

    renderSong(currentSong);
}

function renderSong(song) {

    document.getElementById("artist").textContent =
        song.artist;

    document.getElementById("title").textContent =
        song.title;

    const diff = document.getElementById("difficulty");

    diff.textContent =
        "⭐".repeat(song.difficulty);

    diff.className = "tag " +
        (
            song.difficulty <= 2
                ? "easy"
                : song.difficulty === 3
                    ? "medium"
                    : "hard"
        );

    document.getElementById("moodTag").textContent =
        "♪ " + song.mood;

    document.getElementById("verifiedTag").textContent =
        song.verified
            ? "✓ Аккорды проверены"
            : "⚠ Требует проверки";

    document.getElementById("chords").textContent =
        song.chords;

    document.getElementById("beat").textContent =
        song.beat;

    document.getElementById("bpm").textContent =
        song.bpm + " BPM";

    document.getElementById("capo").textContent =
        song.capo;

    document.getElementById("mood").textContent =
        song.mood;

    document.getElementById("note").textContent =
        song.note;

    const verification =
        document.getElementById("verification");

    if (song.verified) {

        verification.innerHTML =
            `<div class="verified">
                ✓ Аккордовая схема проверена и пригодна
                для использования в карточке песни.
            </div>`;

    } else {

        verification.innerHTML =
            `<div class="notice">
                ⚠️ Эта карточка пока содержит только
                рабочую/упрощённую схему.
                Не воспринимай её как гарантированно
                оригинальные аккорды.
            </div>`;
    }

    updateFavoriteIcon();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ================= СЕТ ================= */

function makeSet() {

    const setCard =
        document.getElementById("setCard");

    const candidates =
        songs.filter(song => song.difficulty <= 3);

    const shuffled =
        [...candidates].sort(() => Math.random() - .5);

    const set = shuffled.slice(0, 8);

    let html = `
        <div class="card">
            <div class="song-title">
                🎤 Сет примерно на 30 минут
            </div>
            <div class="small">
                Подобрал песни, которые реально удобно
                играть подряд на акустической гитаре.
            </div>
            <div class="set-list">
    `;

    set.forEach((song, index) => {

        html += `
            <div class="set-item">
                <b>${index + 1}. ${song.artist} — ${song.title}</b>
                <br>
                <span class="small">
                    ${"⭐".repeat(song.difficulty)}
                    · ${song.bpm} BPM
                </span>
            </div>
        `;
    });

    html += `
            </div>
        </div>
    `;

    setCard.innerHTML = html;

    setCard.scrollIntoView({
        behavior: "smooth"
    });
}


/* ================= ИЗБРАННЫЕ ================= */

function showFavorites() {

    const fav = getFavorites();

    const setCard =
        document.getElementById("setCard");

    if (!fav.length) {

        setCard.innerHTML = `
            <div class="card">
                <div class="song-title">
                    ⭐ Избранное пусто
                </div>
                <div class="extra">
                    Нажимай ♡ на понравившихся песнях,
                    чтобы добавить их сюда.
                </div>
            </div>
        `;

        setCard.scrollIntoView({
            behavior:"smooth"
        });

        return;
    }

    const favoriteSongs =
        songs.filter(song =>
            fav.includes(songKey(song))
        );

    let html = `
        <div class="card">
            <div class="song-title">
                ⭐ Мои песни
            </div>
    `;

    favoriteSongs.forEach((song, index) => {

        html += `
            <div class="set-item"
                 onclick="openFavorite(${songs.indexOf(song)})">
                <b>${index + 1}. ${song.artist} — ${song.title}</b>
                <br>
                <span class="small">
                    ${"⭐".repeat(song.difficulty)}
                    · ${song.mood}
                </span>
            </div>
        `;
    });

    html += `</div>`;

    setCard.innerHTML = html;

    setCard.scrollIntoView({
        behavior:"smooth"
    });
}

function openFavorite(index) {

    currentSong = songs[index];

    renderSong(currentSong);
}


/* ================= ЗАПУСК ================= */

initArtists();
randomSong();

</script>
