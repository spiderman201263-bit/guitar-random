<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎸 Случайная песня</title>
<style>
:root{--bg:#101214;--card:#1b1e22;--card2:#25292e;--text:#f5f6f7;--muted:#9da3aa;--accent:#ffcc33}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,select{font:inherit}
.app{max-width:560px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.logo{font-size:26px;font-weight:800}
.count{font-size:12px;color:var(--muted);background:var(--card2);padding:7px 10px;border-radius:20px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
select,.small{background:var(--card2);color:var(--text);border:1px solid #333840;border-radius:14px;padding:13px 12px;outline:none}
.card{background:linear-gradient(145deg,#202429,#181b1f);border:1px solid #2b3036;border-radius:25px;padding:24px;margin-top:12px;box-shadow:0 16px 40px #0006}
.badge{display:inline-block;color:var(--accent);background:#3a321c;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700}
.song{font-size:28px;font-weight:800;line-height:1.12;margin-top:16px}
.artist{font-size:18px;color:#c8cdd2;margin-top:7px}
.chords{font-size:20px;letter-spacing:.4px;margin:22px 0 15px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{background:var(--card2);padding:8px 10px;border-radius:11px;color:#dfe3e6;font-size:13px}
.actions{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;margin-top:12px}
.btn{border:0;border-radius:15px;padding:15px;font-weight:750;cursor:pointer}
.primary{background:var(--text);color:#111}
.secondary{background:var(--card2);color:var(--text);border:1px solid #333840}
.btn:active{transform:scale(.98)}
.favline{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
.section{margin-top:18px;background:var(--card);border-radius:20px;padding:16px}
.section h3{margin:0 0 12px;font-size:16px}
.setlist{display:none}
.setitem{padding:10px 0;border-bottom:1px solid #30343a}
.setitem:last-child{border-bottom:0}
.setitem b{display:block}
.setitem span{font-size:12px;color:var(--muted)}
.foot{text-align:center;color:#686e75;font-size:11px;margin-top:20px}
@media(max-width:380px){.song{font-size:24px}.controls{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">🎸 Случайная песня</div>
  <div class="count" id="count"></div>
</header>

<div class="controls">
  <select id="genre">
    <option value="Все жанры">🎵 Все жанры</option>
    <option>Русский рок</option>
    <option>Панк</option>
    <option>Поп / рок</option>
  </select>

  <select id="level">
    <option value="0">⭐ Любая сложность</option>
    <option value="1">⭐ Легко</option>
    <option value="2">⭐⭐ Средне</option>
    <option value="3">⭐⭐⭐ Сложно</option>
  </select>
</div>

<div class="card">
  <div class="badge">ТВОЯ ПЕСНЯ</div>

  <div class="song" id="song">Пачка сигарет</div>

  <div class="artist" id="artist">Кино</div>

  <div class="chords" id="chords">
    Am · C · Dm · E
  </div>

  <div class="tags">
    <div class="tag" id="stars">⭐⭐☆☆☆</div>
    <div class="tag" id="genreName">Русский рок</div>
  </div>
</div>

<div class="actions">
  <button class="btn primary" onclick="randomSong()">
    🔀 Другая песня
  </button>

  <button class="btn secondary" onclick="toggleFavorite()" id="favBtn">
    ♡ Избранное
  </button>
</div>

<div class="favline">
  <span id="favCount">❤️ Избранных: 0</span>

  <button class="small" onclick="makeSet()">
    🎤 Сет на 30 минут
  </button>
</div>

<div class="section setlist" id="setlist">
  <h3>🎤 Твой сет</h3>
  <div id="setItems"></div>
</div>

<div class="foot">
  110 песен · играй что выпадет 🎲
</div>

</div>

let current=0;

let favorites=JSON.parse(
  localStorage.getItem("guitarFavorites")||"[]"
);

function filtered(){

  const g=document.getElementById("genre").value;
  const l=Number(document.getElementById("level").value);

  return songs
    .map((s,i)=>({s,i}))
    .filter(x=>
      (g==="Все жанры"||x.s.genre===g)&&
      (l===0||x.s.level===l)
    );
}

function stars(level){

  return "⭐".repeat(level)+
         "☆".repeat(5-level);

}

function show(i){

  current=i;

  const s=songs[i];

  document.getElementById("song").textContent=s.song;

  document.getElementById("artist").textContent=s.artist;

  document.getElementById("chords").textContent=s.chords;

  document.getElementById("stars").textContent=
    stars(s.level);

  document.getElementById("genreName").textContent=
    s.genre;

  document.getElementById("favBtn").textContent=
    isFav(i)?"♥ В избранном":"♡ В избранное";

  document.getElementById("favCount").textContent=
    "❤️ Избранных: "+favorites.length;

}

function randomSong(){

  const list=filtered();

  if(!list.length){

    alert("Нет песен с такими фильтрами");

    return;
  }

  let pick=
    list[Math.floor(Math.random()*list.length)].i;

  if(list.length>1 && pick===current){

    pick=
      list[Math.floor(Math.random()*list.length)].i;

  }

  show(pick);

}

function isFav(i){

  return favorites.includes(i);

}

function toggleFavorite(){

  const p=favorites.indexOf(current);

  if(p>=0){

    favorites.splice(p,1);

  }else{

    favorites.push(current);

  }

  localStorage.setItem(
    "guitarFavorites",
    JSON.stringify(favorites)
  );

  show(current);

}

function makeSet(){

  const list=filtered().map(x=>x.i);

  if(!list.length){

    alert("Нет песен для сета");

    return;
  }

  const pool=[...list].sort(
    ()=>Math.random()-.5
  );

  const selected=[];
  const artists=new Set();

  for(const i of pool){

    if(
      !artists.has(songs[i].artist)||
      selected.length>=10
    ){

      selected.push(i);

      artists.add(songs[i].artist);

    }

    if(selected.length===10) break;

  }

  while(
    selected.length<
    Math.min(10,list.length)
  ){

    selected.push(
      pool[selected.length]
    );

  }

  document.getElementById("setItems").innerHTML=

    selected.map((i,n)=>

      `<div class="setitem">
        <b>
          ${n+1}. ${songs[i].artist} — ${songs[i].song}
        </b>

        <span>
          ${songs[i].chords} · ${stars(songs[i].level)}
        </span>
      </div>`

    ).join("");

  document.getElementById("setlist")
    .style.display="block";

}

document
  .getElementById("genre")
  .addEventListener("change",randomSong);

document
  .getElementById("level")
  .addEventListener("change",randomSong);

document.getElementById("count").textContent=
  songs.length+" песен";

show(0);

try{

  if(window.Telegram?.WebApp){

    Telegram.WebApp.ready();

    Telegram.WebApp.expand();

  }

}catch(e){}

</script>
