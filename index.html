<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎸 Случайная песня</title>

<style>
:root{
  --bg:#101214;
  --card:#1b1e22;
  --card2:#25292e;
  --text:#f5f6f7;
  --muted:#9da3aa;
  --accent:#ffcc33;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,select{
  font:inherit;
}

.app{
  max-width:560px;
  margin:auto;
  padding:22px 16px 30px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.count{
  font-size:12px;
  color:var(--muted);
  background:var(--card2);
  padding:7px 10px;
  border-radius:20px;
}

select{
  width:100%;
  background:var(--card2);
  color:white;
  border:1px solid #333840;
  border-radius:14px;
  padding:13px;
  margin-bottom:12px;
}

.card{
  background:linear-gradient(145deg,#202429,#181b1f);
  border:1px solid #2b3036;
  border-radius:25px;
  padding:24px;
  margin-top:8px;
  box-shadow:0 16px 40px #0006;
}

.badge{
  display:inline-block;
  color:var(--accent);
  background:#3a321c;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
}

.song{
  font-size:28px;
  font-weight:800;
  line-height:1.12;
  margin-top:16px;
}

.artist{
  font-size:18px;
  color:#c8cdd2;
  margin-top:7px;
}

.chords{
  font-size:20px;
  margin:22px 0 12px;
}

.beat{
  color:#b9bec4;
  font-size:14px;
  margin-bottom:15px;
}

.tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.tag{
  background:var(--card2);
  padding:8px 10px;
  border-radius:11px;
  color:#dfe3e6;
  font-size:13px;
}

.actions{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:10px;
  margin-top:12px;
}

.btn{
  border:0;
  border-radius:15px;
  padding:15px;
  font-weight:750;
  cursor:pointer;
}

.primary{
  background:white;
  color:#111;
}

.secondary{
  background:var(--card2);
  color:white;
  border:1px solid #333840;
}

.btn:active{
  transform:scale(.98);
}

.note{
  color:#7f858b;
  text-align:center;
  font-size:12px;
  margin-top:18px;
  line-height:1.4;
}

@media(max-width:380px){
  .song{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">🎸 Случайная песня</div>
  <div class="count">30 песен</div>
</header>

<select id="level">
  <option value="0">⭐ Любая сложность</option>
  <option value="1">⭐ Легко</option>
  <option value="2">⭐⭐ Средне</option>
  <option value="3">⭐⭐⭐ Сложно</option>
</select>

<div class="card">

  <div class="badge">ТВОЯ ПЕСНЯ</div>

  <div class="song" id="song"></div>

  <div class="artist" id="artist"></div>

  <div class="chords" id="chords"></div>

  <div class="beat" id="beat"></div>

  <div class="tags">

    <div class="tag" id="stars"></div>

    <div class="tag">
      🎸 Основные аккорды
    </div>

  </div>

</div>

<div class="actions">

  <button class="btn primary" onclick="randomSong()">
    🔀 Другая песня
  </button>

  <button class="btn secondary"
          onclick="toggleFavorite()"
          id="favBtn">
    ♡ В избранное
  </button>

</div>

<div class="note">
  Аккорды — основные аккорды песни.<br>
  Для полного разбора могут использоваться дополнительные аккорды.
</div>

</div>

];


let current = 0;

let favorites =
JSON.parse(
localStorage.getItem("guitarFavorites") || "[]"
);


function stars(level){

  return "⭐".repeat(level) +
         "☆".repeat(5-level);

}


function filteredSongs(){

  const level =
    Number(
      document.getElementById("level").value
    );

  return songs
    .map((song,index)=>({
      song:song,
      index:index
    }))
    .filter(item =>
      level === 0 ||
      item.song.level === level
    );

}


function isFavorite(index){

  return favorites.includes(index);

}


function showSong(index){

  current = index;

  const song = songs[index];

  document.getElementById("song")
    .textContent = song.song;

  document.getElementById("artist")
    .textContent = song.artist;

  document.getElementById("chords")
    .textContent = song.chords;

  document.getElementById("beat")
    .textContent =
    "🥁 Бой / перебор: " + song.beat;

  document.getElementById("stars")
    .textContent = stars(song.level);

  document.getElementById("favBtn")
    .textContent =
    isFavorite(index)
    ? "♥ В избранном"
    : "♡ В избранное";

}


function randomSong(){

  const list = filteredSongs();

  if(!list.length){

    alert("Нет песен с такой сложностью");

    return;

  }

  let random =
    Math.floor(
      Math.random() * list.length
    );

  let index = list[random].index;

  if(list.length > 1 && index === current){

    random =
      Math.floor(
        Math.random() * list.length
      );

    index = list[random].index;

  }

  showSong(index);

}


function toggleFavorite(){

  const position =
    favorites.indexOf(current);

  if(position >= 0){

    favorites.splice(position,1);

  }else{

    favorites.push(current);

  }

  localStorage.setItem(
    "guitarFavorites",
    JSON.stringify(favorites)
  );

  showSong(current);

}


document
  .getElementById("level")
  .addEventListener(
    "change",
    randomSong
  );


document.getElementById("count")
  .textContent =
  songs.length + " песен";


showSong(0);


try{

  if(window.Telegram &&
     window.Telegram.WebApp){

    Telegram.WebApp.ready();

    Telegram.WebApp.expand();

  }

}catch(error){

}

</script>
