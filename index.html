];

let current=0;
let favorites=JSON.parse(localStorage.getItem("guitarFavorites")||"[]");

function filtered(){
  const g=document.getElementById("genre").value;
  const l=Number(document.getElementById("level").value);
  return songs.map((s,i)=>({s,i})).filter(x=>(g==="袙褋械 卸邪薪褉褘"||x.s.genre===g)&&(l===0||x.s.level===l));
}

function stars(level){return "猸�".repeat(level)+"鈽�".repeat(5-level)}

function show(i){
  current=i;
  const s=songs[i];
  document.getElementById("song").textContent=s.song;
  document.getElementById("artist").textContent=s.artist;
  document.getElementById("chords").textContent=s.chords;
  document.getElementById("stars").textContent=stars(s.level);
  document.getElementById("genreName").textContent=s.genre;
  document.getElementById("favBtn").textContent=isFav(i)?"鈾� 袙 懈蟹斜褉邪薪薪芯屑":"鈾� 袙 懈蟹斜褉邪薪薪芯械";
  document.getElementById("favCount").textContent="鉂わ笍 袠蟹斜褉邪薪薪褘褏: "+favorites.length;
}

function randomSong(){
  const list=filtered();
  if(!list.length){alert("袧械褌 锌械褋械薪 褋 褌邪泻懈屑懈 褎懈谢褜褌褉邪屑懈");return}
  let pick=list[Math.floor(Math.random()*list.length)].i;
  if(list.length>1 && pick===current) pick=list[Math.floor(Math.random()*list.length)].i;
  show(pick);
}

function isFav(i){return favorites.includes(i)}

function toggleFavorite(){
  const p=favorites.indexOf(current);
  if(p>=0) favorites.splice(p,1); else favorites.push(current);
  localStorage.setItem("guitarFavorites",JSON.stringify(favorites));
  show(current);
}

function makeSet(){
  const list=filtered().map(x=>x.i);
  if(!list.length){alert("袧械褌 锌械褋械薪 写谢褟 褋械褌邪");return}
  const pool=[...list].sort(()=>Math.random()-.5);
  const selected=[];
  const artists=new Set();
  for(const i of pool){
    if(!artists.has(songs[i].artist)||selected.length>=10){selected.push(i);artists.add(songs[i].artist)}
    if(selected.length===10)break;
  }
  while(selected.length<Math.min(10,list.length)) selected.push(pool[selected.length]);
  document.getElementById("setItems").innerHTML=selected.map((i,n)=>
    `<div class="setitem"><b>${n+1}. ${songs[i].artist} 鈥� ${songs[i].song}</b><span>${songs[i].chords} 路 ${stars(songs[i].level)}</span></div>`
  ).join("");
  document.getElementById("setlist").style.display="block";
}

document.getElementById("genre").addEventListener("change",randomSong);
document.getElementById("level").addEventListener("change",randomSong);
document.getElementById("count").textContent=songs.length+" 锌械褋械薪";
show(0);
